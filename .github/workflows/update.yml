name: Atualizar e publicar
on:
  schedule: [{cron: "*/10 * * * *"}]   # a cada 10 min (o GitHub pode atrasar alguns minutos)
  push: {branches: [main]}
  workflow_dispatch:
permissions: {contents: read, pages: write, id-token: write}
concurrency: {group: pages, cancel-in-progress: true}
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: {name: github-pages, url: "${{ steps.d.outputs.page_url }}"}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python scripts/update.py
      - name: Prepare site
        env:
          DATA_VERSION: ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          mkdir -p _site/data
          cp sitemap.xml robots.txt _site/
          cp data/data.json "_site/data/data-${DATA_VERSION}.json"
          sed "s|data/data.json|data/data-${DATA_VERSION}.json|g" index.html > _site/index.html
      - uses: actions/upload-pages-artifact@v3
        with: {path: _site}
      - name: Wait for Pages artifact availability
        run: sleep 5
      - id: d
        uses: actions/deploy-pages@v4
